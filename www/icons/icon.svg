<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b1f7a"/>
      <stop offset="1" stop-color="#120d24"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9d5ff"/>
      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".45" r=".5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".6"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="236" r="200" fill="url(#glow)"/>
  <!-- 검 -->
  <g transform="rotate(-35 256 256)">
    <rect x="244" y="70" width="24" height="270" rx="6" fill="#e5e7eb"/>
    <polygon points="244,70 268,70 256,40" fill="#f9fafb"/>
    <rect x="196" y="330" width="120" height="22" rx="11" fill="#fbbf24"/>
    <rect x="246" y="350" width="20" height="70" rx="8" fill="#92400e"/>
    <circle cx="256" cy="430" r="16" fill="#fbbf24"/>
  </g>
  <!-- 에테르 수정 -->
  <polygon points="256,150 330,250 256,380 182,250" fill="url(#gem)" stroke="#f5f3ff" stroke-width="8" stroke-linejoin="round"/>
  <polygon points="256,150 256,380 182,250" fill="#ffffff" opacity=".18"/>
</svg>
